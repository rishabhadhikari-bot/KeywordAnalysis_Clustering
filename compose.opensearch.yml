services:
  opensearch:
    image: opensearchproject/opensearch:3.8.0
    container_name: traffic-prediction-opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - traffic-opensearch-data:/usr/share/opensearch/data

volumes:
  traffic-opensearch-data:
